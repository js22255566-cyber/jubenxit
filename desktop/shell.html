<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>对白工坊</title><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f3f6f4;color:#233b30}header{height:110px;border-bottom:1px solid #d7e1da;padding:13px 20px;background:#fbfdfc}.top{display:flex;align-items:center;gap:8px}.brand{font-size:19px;font-weight:650;letter-spacing:1px;margin-right:17px}.brand small{font-size:10px;font-weight:400;letter-spacing:0;color:#7a8d82;margin-left:6px}button{border:1px solid #d5dfd8;border-radius:8px;background:white;padding:7px 12px;color:#3c5547;font:inherit;cursor:pointer}button:hover{background:#e7f0e9}button.active{background:#244e3a;color:white;border-color:#244e3a}.spacer{flex:1}.connection{display:flex;gap:10px;align-items:center;margin-top:13px;font-size:12px;color:#64786b}.dot{width:8px;height:8px;border-radius:50%;background:#9aa89e}.dot.ready{background:#35a46c}.dot.warn{background:#d79a33}#notice{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}footer{position:fixed;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:15px;padding:0 20px;border-top:1px solid #d7e1da;background:#fbfdfc;font-size:11px;color:#718478}footer button{font-size:11px;padding:4px 8px}.loading{padding:45px;text-align:center;color:#7c8d82}dialog{border:1px solid #d5dfd8;border-radius:16px;max-width:570px;padding:26px;color:#2c4938;box-shadow:0 20px 80px #17382233}dialog::backdrop{background:#1c352640}dialog h2{font-size:20px;margin-top:0}dialog p{line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}dialog button{margin-right:7px}#dialogText{max-height:420px;overflow:auto}
</style></head><body>
<header><div class="top"><span class="brand">对白工坊<small>桌面版</small></span><button data-command="workbench">工坊</button><button data-command="whatsapp">WhatsApp</button><button data-command="split">并排显示</button><span class="spacer"></span><button data-command="bind">绑定当前群</button><button data-command="unbind">解除绑定</button><button data-command="reload">刷新工坊</button></div><div class="connection"><span class="dot" id="dot"></span><strong id="status">正在检查连接</strong><span id="notice">首次使用：登录工坊 → WhatsApp 扫码 → 打开目标群 → 绑定当前群。</span><button data-command="diagnose">检查连接</button></div></header>
<main class="loading">正在加载工坊和 WhatsApp…</main>
<footer><span id="version">Windows 桌面版</span><span>发送账号以 WhatsApp 实际登录账号为准</span><span class="spacer"></span><button data-command="reload-wa">刷新 WhatsApp</button><button id="guide">使用说明</button><button data-command="browser">浏览器打开工坊</button></footer>
<dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button id="close">知道了</button></dialog><script src="shell.js"></script></body></html>
