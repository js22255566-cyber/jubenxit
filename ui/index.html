function parseCSV(text){const sep=text.includes('\t')?'\t':',',rows=[];let row=[],v='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===sep&&!quote){row.push(v);v=''}else if(c==='\n'&&!quote){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}row.push(v.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);return rows}

 case'configuploadjson':chooseFile(async f=>{if(f.size>100000)throw Error('JSON文件过大');const text=await f.text();let data;try{data=JSON.parse(text)}catch{throw Error('请选择有效的服务账号JSON文件')}if(!data.client_email||!data.private_key)throw Error('文件中缺少服务账号邮箱或私钥');if(!$('#config-google-json'))return;$('#config-google-json').value=text;$('#config-service-email').value=data.client_email;$('#config-file-status').textContent='已选择 '+f.name+'，连接时会加密保存'},'.json');break;

 case'morelearning':learningPage=Math.max(1,learningPage+Number(el.dataset.value||1));renderRight();break;

 case'restoretrash':await mutate('trash','restore',{id});settings('trash');renderLists();break;
 case'restoreversion':{const h=state.history.find(x=>x.id===id);if(confirm('恢复此修改前的版本？此操作也会记录历史。')){await mutate(h.collection,'save',h.before);settings('history');renderLists()}break}
 case'export':{const backupState=live?(await api('state')).state:state;download('dialogue-atelier-backup.json',JSON.stringify({format:'dialogue-atelier-v1',exportedAt:now(),state:backupState},null,2));toast('已导出备份');break;}
 case'exportcsv':download('characters.csv','\uFEFF'+[F.map(x=>x[1]),...state.characters.map(c=>F.map(([k])=>c[k]||''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');break;
 case'backupimport':chooseFile(async f=>{const d=JSON.parse(await f.text());if(d.format!=='dialogue-atelier-v1'||C.some(c=>c!=='topics'&&!Array.isArray(d.state[c])))throw Error('备份格式无效');if(confirm('用备份覆盖当前本地试用数据？')){state=normalizeState(d.state);await persist();selected=state.characters[0]?.id||'';close();render()}},'.json');break;
 case'clearall':if(confirm('清空本地全部试用数据？请先导出备份。')){state=Object.fromEntries(C.map(c=>[c,[]]));writeBuffers={};selected='';attachments=[];await persist();close();render()}break;
 }}

function selectingCardText(event){const target=event.target.closest('.char,.history-record,.role-history-item,.reply-source,.tg-search-result');if(!target||event.target.closest('button,input,textarea,select'))return false;const selection=window.getSelection?.();if(!selection||selection.isCollapsed||!selection.toString().trim())return false;return target.contains(selection.anchorNode)||target.contains(selection.focusNode)}
document.addEventListener('click',async e=>{if(selectingCardText(e))return;const menuOption=e.target.closest('#message-menu [data-action]');if(menuOption){closeMessageMenu();try{await action(menuOption.dataset.action,menuOption)}catch(err){toast(err.message)}return;}closeMessageMenu();if(e.target.matches('[data-castcheck]'))return;if(e.target.closest('.cast-inline-editor,.cast-note-editor')&&!e.target.closest('[data-action="saveleftprofile"],[data-action="cancelleftprofile"]'))return;const el=e.target.closest('[data-action]');if(!el)return;try{await action(el.dataset.action,el)}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&e.target.closest('.chat')){e.preventDefault();openTgSearch();return;}if(e.target.id==='tg-search-query'&&['Enter','ArrowUp','ArrowDown','Escape'].includes(e.key)){e.preventDefault();clearTimeout(tgSearchTimer);if(e.key==='Escape')$('#tg-search').classList.add('hidden');else if(e.key==='ArrowUp'||e.key==='ArrowDown'){renderTgSearch();tgSearchNavigate(e.key==='ArrowUp'?-1:1)}else{renderTgSearch();if(tgSearchActiveId===tgSearchLastLocatedId)tgSearchNavigate(e.shiftKey?1:-1);else if(tgSearchActiveId)tgSearchLocate(tgSearchActiveId)}return;}if(e.key==='Enter'&&e.target.matches('.tg-search-result')){e.preventDefault();e.target.click();return;}if(e.key==='Escape'){closeMessageMenu();composerPopover=null;renderComposerPopover()}const message=e.target.closest('.message');if(message&&(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))){e.preventDefault();const r=message.getBoundingClientRect();openMessageMenu(message.dataset.messageId,r.left+40,r.top+20);return;}if(e.target.closest('.cast-inline-editor,.cast-note-editor')){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveLeftProfile(selected).catch(e=>toast(e.message))}return;}if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='quickchat'){e.preventDefault();action('sendquick',e.target).catch(e=>toast(e.message));return;}if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveWrite().catch(e=>toast(e.message))}if(e.key==='Enter'&&e.target.matches('.char'))e.target.click()});
document.addEventListener('input',e=>{const id=e.target.id;if(['tg-search-query','tg-search-from','tg-search-to'].includes(id)){clearTimeout(tgSearchTimer);tgSearchTimer=setTimeout(()=>renderTgSearch(true),180);return;}if(id==='translation-style'){const cid=e.target.dataset.role;translationStyleEdits.set(cid,e.target.value);if($('#translation-card-status'))$('#translation-card-status').textContent='指令已生效，正在等待自动保存…';clearTimeout(translationStyleTimers.get(cid));translationStyleTimers.set(cid,setTimeout(()=>saveTranslationStyle(cid).catch(err=>{toast('翻译卡未保存：'+err.message);if(selected===cid&&$('#translation-card-status'))$('#translation-card-status').textContent='未保存 · 请点击保存重试'}),1000));return;}if(id==='topictitle'){topicDrafts[topicDay]=e.target.value;$('#topicstatus').textContent='正在编辑…';clearTimeout(topicTimer);topicTimer=setTimeout(()=>saveTopic(topicDay).catch(e=>{if($('#topicstatus'))$('#topicstatus').textContent=e.message}),700);resizeTopic();return;}if(e.target.dataset.leftfield){const cid=e.target.dataset.role;leftEdits[cid]={...(leftEdits[cid]||{}),[e.target.dataset.leftfield]:e.target.value};$$('[data-leftfield]').filter(el=>el!==e.target&&el.dataset.role===cid&&el.dataset.leftfield===e.target.dataset.leftfield).forEach(el=>el.value=e.target.value);resizeDetailFields();const status=document.getElementById('leftstatus-'+cid);if(status)status.textContent='有未保存修改';return;}if(inlineEdit&&['messagezh','messagept','messagetime'].includes(id)){inlineEdit[id==='messagezh'?'zh':id==='messagept'?'pt':'time']=e.target.value;if(id==='messagezh'){clearTimeout(inlineTranslateTimer);inlineTranslateTimer=setTimeout(()=>translateInline(),1200)}return;}if(e.target.dataset.previewfield){const i=Number(e.target.dataset.row),key=e.target.dataset.previewfield;importRows[i][key]=e.target.value;importSourceRows[i].overrides={...(importSourceRows[i].overrides||{}),[key]:e.target.value};const col=importMapping.indexOf(key);if(col>=0)importSourceRows[i][col]=e.target.value;revalidateImport();}if(id==='charsearch')renderCharacters();if(id==='quickchat'){chatBuffers[selected]=e.target.value;resizeQuickInput()}if(['historyquery','historyfrom','historyto'].includes(id)){historyFilters[id==='historyquery'?'query':id==='historyfrom'?'from':'to']=e.target.value;historyPage=1;renderRoleWindow();}if(id==='rolehistorysearch'){roleHistoryQuery=e.target.value;$('#rolehistorylist').innerHTML=historyItems(selected);}if(['filtertext','filterfrom','filterto'].includes(id))renderMessages();if(['zh','pt','storytime'].includes(id)){draftDirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveWrite({check:!!service.ai}).catch(e=>toast(e.message)),1200);if(id==='zh'){clearTimeout(translateTimer);if(service.ai)translateTimer=setTimeout(()=>translate().catch(e=>toast(e.message)),1500)}}if(id==='direction'){prefs.direction=e.target.value;localStorage.setItem(PREF,JSON.stringify(prefs))}});
document.addEventListener('change',e=>{const el=e.target,id=el.id;if(['tg-search-role','tg-search-from','tg-search-to'].includes(id)){clearTimeout(tgSearchTimer);renderTgSearch(true);return;}if(id==='topicday'){clearTimeout(topicTimer);const previousDay=topicDay;topicDay=el.value||previousDay;if(topicDay!==previousDay&&Object.hasOwn(topicDrafts,previousDay))saveTopic(previousDay).catch(e=>toast(e.message));renderTopic(true);return;}if(id==='historyscope'){historyFilters.scope=el.value;historyPage=1;renderRoleWindow();return;}if(el.dataset.leftfield){leftEdits[el.dataset.role]={...(leftEdits[el.dataset.role]||{}),[el.dataset.leftfield]:el.value};return;}if(el.dataset.importmap!==undefined){importMapping[Number(el.dataset.importmap)]=el.value;const used=importMapping.filter(Boolean);if(new Set(used).size!==used.length){toast('同一字段只能对应一列');return;}buildImportRows();showCharacterPreview();return;}if(id==='importoverwrite'){importOverwrite=el.checked;buildImportRows();showCharacterPreview();return;}if(el.dataset.castcheck){el.checked?selectedCharacters.add(el.dataset.castcheck):selectedCharacters.delete(el.dataset.castcheck);renderCharacters();return;}if(['filterchar','filterstatus'].includes(id))renderMessages();if(el.dataset.message){if(el.checked)selectedMessages.add(el.dataset.message);else selectedMessages.delete(el.dataset.message);renderMessages()}if(id==='addairole'&&el.value){modalContext.roleOrder.push(el.value);showAiRoles()}if(el.dataset.importindex){const i=Number(el.dataset.importindex);importRows[i].characterId=el.value;importRows[i].issue=el.value?'':'未匹配人物';$('#issue-'+i).textContent=importRows[i].issue||'可导入'}if(['draftfilter','authorfilter'].includes(id)){$$('[data-draft]').forEach(card=>card.classList.toggle('hidden',($('#draftfilter').value&&card.dataset.character!==$('#draftfilter').value)||($('#authorfilter').value&&card.dataset.author!==$('#authorfilter').value)))}});
let draggingCastId='';
$('#charlist').addEventListener('dragstart',event=>{const handle=event.target.closest('[data-drag-id]');if(!handle)return;draggingCastId=handle.dataset.dragId;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggingCastId)});
$('#charlist').addEventListener('dragover',event=>{const card=event.target.closest('.char[data-id]');if(!draggingCastId||!card)return;event.preventDefault();event.dataTransfer.dropEffect='move';});
$('#charlist').addEventListener('drop',event=>{const card=event.target.closest('.char[data-id]');if(!draggingCastId||!card)return;event.preventDefault();const rect=card.getBoundingClientRect();moveCastBefore(draggingCastId,card.dataset.id,event.clientY>rect.top+rect.height/2);draggingCastId=''});
$('#charlist').addEventListener('dragend',()=>{draggingCastId=''});
window.addEventListener('online',()=>{if(live)flushOutbox()});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('dialogue-topic-drafts',JSON.stringify(topicDrafts))}catch{}preserveWrite();if(!live){try{localStorage.setItem('dialogue-write-buffers',JSON.stringify(writeBuffers))}catch{}}});
try{writeBuffers=JSON.parse(localStorage.getItem('dialogue-write-buffers')||'{}')}catch{}
setInterval(async()=>{if(!live||busy||cloudWrites||document.hidden)return;try{await refresh();}catch(e){$('#sync').textContent='同步失败 · '+e.message}},30000);
window.addEventListener('storage',async e=>{if(e.key==='dialogue-atelier-db-ping'&&!live){try{const saved=await loadLocal();if(saved){state=normalizeState(saved);renderLists();if(tab==='drafts')renderRight()}}catch{}return;}if(e.key===KEY&&!live){try{state=normalizeState(JSON.parse(e.newValue));renderLists();if(tab==='drafts')renderRight()}catch{}}});
try{topicDrafts=JSON.parse(localStorage.getItem('dialogue-topic-drafts')||'{}')}catch{}
let chatPositionReady=false,wsIndicatorBusy=false;
function saveChatPosition(){if(!chatPositionReady)return;try{const location=captureChatLocation();location.bottom=$('#messages').scrollHeight-$('#messages').clientHeight-$('#messages').scrollTop<60&&chatOffset===0;sessionStorage.setItem('dialogue-chat-position',JSON.stringify(location))}catch{}}
function restoreChatPosition(){try{const saved=JSON.parse(sessionStorage.getItem('dialogue-chat-position')||'null');if(saved){for(const [id,value] of Object.entries(saved.filters||{})){const el=$('#'+id);if(el)el.value=value}chatOffset=Number(saved.offset)||0;chatJumpId=saved.anchor||null;renderMessages();const box=$('#messages'),anchor=saved.anchor&&document.getElementById('msg-'+saved.anchor);if(saved.bottom)box.scrollTop=box.scrollHeight;else if(anchor)box.scrollTop+=anchor.getBoundingClientRect().top-box.getBoundingClientRect().top-(saved.delta||0);else box.scrollTop=saved.scroll||0;updateChatNavigation()}}catch{}finally{chatPositionReady=true}}
let wsIndicatorFailures=0;
async function checkWsIndicator(){const el=$('#ws-connection-indicator');if(!el||wsIndicatorBusy)return;if(!prefs.wsEnabled){el.textContent='WS · 未启用';el.title='点击设置 WhatsApp 联动';return}wsIndicatorBusy=true;try{const d=await wsRequest('STATUS',null,8000);const ready=d.ready&&d.binding?.groupHash===prefs.wsBinding?.groupHash;wsIndicatorFailures=0;el.textContent=ready?'● WS 已连接':'● WS 未就绪';el.style.color=ready?'#17815c':'#b45309';el.title=ready?'已绑定：'+d.binding.name+'；点击查看设置':'请打开已绑定群并检查扩展连接';}catch(e){wsIndicatorFailures++;el.textContent=wsIndicatorFailures<2?'● WS 正在恢复':'● WS 未连接';el.style.color='#b45309';el.title='连接检查暂未返回：'+e.message+'；正在自动检查'}finally{wsIndicatorBusy=false}}
initialize().then(async()=>{loadWsJobs();renderMessages();restoreChatPosition();checkWsIndicator();if(user.admin&&state.characters.length&&!state.characters.some(c=>c.roleType==='primary'))await createPrimarySlots()}).catch(e=>toast(e.message));

document.addEventListener('paste',e=>{if(e.target.id!=='importtext')return;const html=e.clipboardData?.getData('text/html');if(!html)return;const doc=new DOMParser().parseFromString(html,'text/html'),table=doc.querySelector('table');if(!table)return;const text=Array.from(table.rows).map(row=>Array.from(row.cells).map(cell=>{const img=cell.querySelector('img'),a=cell.querySelector('a');return(img?.getAttribute('src')||cell.textContent?.trim()||a?.getAttribute('href')||'').replace(/\t/g,' ').replace(/\r?\n/g,' ')}).join('\t')).join('\n');if(text){e.preventDefault();e.target.value=text;importText=text;toast('已粘贴整块表格，点击识别并预览')}});
document.addEventListener('toggle',e=>{if(e.target.matches('[data-leftdetails]')){const id=e.target.dataset.leftdetails;e.target.open?leftExtraOpen.add(id):leftExtraOpen.delete(id)}},true);
document.addEventListener('contextmenu',e=>{const m=e.target.closest('.message');if(!m||e.target.closest('.inline-message-editor'))return;e.preventDefault();openMessageMenu(m.dataset.messageId,e.clientX,e.clientY)});
let messagePressTimer,messagePressPoint;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const m=e.target.closest('.message');if(!m||e.target.closest('button,input,textarea'))return;messagePressPoint={x:e.clientX,y:e.clientY};messagePressTimer=setTimeout(()=>openMessageMenu(m.dataset.messageId,e.clientX,e.clientY),550)});
document.addEventListener('pointerup',()=>clearTimeout(messagePressTimer));document.addEventListener('pointercancel',()=>clearTimeout(messagePressTimer));document.addEventListener('pointermove',e=>{if(messagePressPoint&&Math.hypot(e.clientX-messagePressPoint.x,e.clientY-messagePressPoint.y)>10)clearTimeout(messagePressTimer)});
$('#messages').addEventListener('scroll',()=>{updateChatNavigation();saveChatPosition()},{passive:true});
window.addEventListener('pagehide',saveChatPosition);
window.addEventListener('focus',checkWsIndicator);
setInterval(()=>{if(!document.hidden)checkWsIndicator()},30000);
window.addEventListener('resize',()=>{closeMessageMenu();resizeDetailFields();updateChatNavigation()});document.addEventListener('wheel',closeMessageMenu,true);
